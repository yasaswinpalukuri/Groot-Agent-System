name: Dashboard

# No path filters: a required status check that never runs leaves PRs stuck as "pending".
on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: dashboard

jobs:
  typecheck-build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

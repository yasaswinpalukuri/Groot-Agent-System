# Groot IAM — Phase 6: OpenLDAP directory
#
# Design notes (the WHY):
# - Image pinned by DIGEST via .env, never by tag. Tags are mutable; digests are not.
# - Bound to 127.0.0.1 only. LDAP is never exposed to the tailnet. Keycloak reaches
#   it over the shared docker network as openldap (StartTLS on 1389 / LDAPS on 1636).
# - Anonymous binds disabled: unauthenticated directory enumeration is classic recon.
# - cn=config admin enabled so ACLs/TLS are managed as idempotent LDIFs
#   (config/*.ldif via apply-config.sh) instead of image-init side effects.
# - Non-standard container ports (1389/1636): image runs as non-root UID 1001.
#
# TLS (step 6.5):
# - ./tls is mounted as a DIRECTORY (read-only). Renewal replaces files by atomic
#   rename (new inode); single-file bind mounts would stay pinned to the old inode.
# - TLS material is configured by config/20-tls.ldif, not by these env vars.
# - LDAP_ENABLE_TLS is a staged toggle (default "no" from .env). It only adds the
#   ldaps:// listener; flipping it on BEFORE 20-tls.ldif is applied would make
#   slapd refuse to start (listener with no certificate).

services:
  openldap:
    image: ${LDAP_IMAGE:?LDAP_IMAGE must be set in .env (digest-pinned)}
    container_name: groot-openldap
    restart: unless-stopped
    environment:
      LDAP_ROOT: "dc=groot,dc=local"
      LDAP_ADMIN_USERNAME: "admin"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?set in .env}
      LDAP_CONFIG_ADMIN_ENABLED: "yes"
      LDAP_CONFIG_ADMIN_USERNAME: "config"
      LDAP_CONFIG_ADMIN_PASSWORD: ${LDAP_CONFIG_ADMIN_PASSWORD:?set in .env}
      LDAP_ALLOW_ANON_BINDING: "no"
      LDAP_CUSTOM_LDIF_DIR: "/ldifs"
      LDAP_PORT_NUMBER: "1389"
      LDAP_LOGLEVEL: "256"          # 256 = stats: connections, binds, searches, ssf
      # --- TLS (staged; see header) ---
      LDAP_ENABLE_TLS: ${LDAP_ENABLE_TLS:-no}
      LDAP_LDAPS_PORT_NUMBER: "1636"
      LDAP_TLS_CERT_FILE: "/tls/ldap.crt"
      LDAP_TLS_KEY_FILE: "/tls/ldap.key"
      LDAP_TLS_CA_FILE: "/tls/ca.crt"
    ports:
      - "127.0.0.1:3389:1389"
      - "127.0.0.1:6636:1636"
    volumes:
      - ./ldifs:/ldifs:ro
      - ./tls:/tls:ro
      - ldap-data:/bitnami/openldap
    networks:
      - groot-iam
    healthcheck:
      # LDAPS admin bind, verifying the server cert against our root (/tls/ca.crt).
      # 127.0.0.1 (an IP SAN), NOT localhost: libldap substitutes the machine
      # hostname for 'localhost' when checking the cert, which would fail.
      test: ["CMD-SHELL", "LDAPTLS_CACERT=/tls/ca.crt ldapsearch -x -H ldaps://127.0.0.1:1636 -D \"cn=$${LDAP_ADMIN_USERNAME},$${LDAP_ROOT}\" -w \"$${LDAP_ADMIN_PASSWORD}\" -b \"$${LDAP_ROOT}\" -s base dn >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  ldap-data:
    name: groot-ldap-data

networks:
  groot-iam:
    external: true
